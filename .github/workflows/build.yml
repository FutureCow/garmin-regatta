name: Build Garmin IQ App

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ── Garmin Connect IQ SDK ──────────────────────────────────────────
      # Zelfde aanpak als regatta-screen: direct downloaden via sdks.json.
      # Geen Garmin account/login nodig.

      - name: Cache Connect IQ SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: connectiq-sdk
          key: connectiq-sdk-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Download Connect IQ SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          SDK_FILE=$(curl -s https://developer.garmin.com/downloads/connect-iq/sdks/sdks.json | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          # Neem laatste 8.x of 7.x — geen beta
          stable = [s for s in data if not s.get('beta', False)]
          stable.sort(key=lambda s: list(map(int, s['version'].split('.'))), reverse=True)
          print(stable[0]['linux'])
          ")
          SDK_URL="https://developer.garmin.com/downloads/connect-iq/sdks/${SDK_FILE}"
          echo "Downloading: ${SDK_FILE}"
          curl -fL "$SDK_URL" -o /tmp/sdk.zip
          unzip -q /tmp/sdk.zip -d connectiq-sdk
          chmod +x connectiq-sdk/bin/monkeyc
          connectiq-sdk/bin/monkeyc --version

      # ── Device definitions (nodig voor compiler) ────────────────────────
      # Minimaal: alleen de devices die we targeten in manifest.xml.
      - name: Create device definitions
        run: |
          python3 .github/scripts/create_devices.py
          echo "Devices: $(ls ~/.Garmin/ConnectIQ/Devices/ | wc -l) gedefinieerd"

      # ── Developer key ──────────────────────────────────────────────────
      # Probeer eerst org/repo secret, anders genereer via monkeyc -g.
      - name: Setup developer key
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 --decode > developer_key.der
            echo "Developer key from GARMIN_DEVELOPER_KEY_B64 secret"
          else
            echo "Genereren via monkeyc -g..."
            "$GITHUB_WORKSPACE/connectiq-sdk/bin/monkeyc" -g \
              -o /tmp/dummy.prg 2>&1 || true
            if [ -f developer_key.der ] && [ -s developer_key.der ]; then
              echo "Key gegenereerd: $(wc -c < developer_key.der) bytes"
            else
              echo "::error::Kon geen developer key genereren."
              echo "Zet GARMIN_DEVELOPER_KEY_B64 secret op org-niveau."
              exit 1
            fi
          fi
        env:
          KEY_B64: ${{ secrets.GARMIN_DEVELOPER_KEY_B64 }}

      # ── Build ──────────────────────────────────────────────────────────
      - name: Build .iq
        run: |
          mkdir -p bin
          connectiq-sdk/bin/monkeyc \
            -e \
            --override-devices-json ~/.Garmin/ConnectIQ/Devices \
            -f monkey.jungle \
            -o bin/regatta.iq \
            -y developer_key.der \
            -l 0
          ls -lh bin/regatta.iq

      # ── Build per-device .prg (voor sideloading) ──────────────────────
      - name: Build per-device .prg
        run: |
          mkdir -p bin/devices
          for device in fr965 fr955 fenix8 fenix7x; do
            connectiq-sdk/bin/monkeyc \
              -d $device \
              --override-devices-json ~/.Garmin/ConnectIQ/Devices \
              -f monkey.jungle \
              -o bin/devices/regatta-$device.prg \
              -y developer_key.der \
              -l 0 2>/dev/null && echo "  ✓ $device" || echo "  ✗ $device"
          done

      # ── Upload artifact ────────────────────────────────────────────────
      - name: Upload .iq artifact
        uses: actions/upload-artifact@v4
        with:
          name: regatta-${{ github.sha }}
          path: |
            bin/regatta.iq
            bin/devices/

      # ── Release upload (alleen bij tags) ───────────────────────────────
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/regatta.iq
            bin/devices/*.prg
