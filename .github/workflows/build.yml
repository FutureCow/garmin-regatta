name: Build Garmin IQ App

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache Connect IQ SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: connectiq-sdk
          key: connectiq-sdk-v2-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Download Connect IQ SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          SDK_FILE=$(curl -s https://developer.garmin.com/downloads/connect-iq/sdks/sdks.json | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          data.sort(key=lambda s: list(map(int, s['version'].split('.'))), reverse=True)
          print(data[0]['linux'])
          ")
          SDK_URL="https://developer.garmin.com/downloads/connect-iq/sdks/${SDK_FILE}"
          echo "Downloading: ${SDK_FILE}"
          curl -fL "$SDK_URL" -o /tmp/sdk.zip
          unzip -q /tmp/sdk.zip -d connectiq-sdk
          chmod +x connectiq-sdk/bin/monkeyc
          connectiq-sdk/bin/monkeyc --version

      - name: Setup developer key
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 --decode > developer_key.der
            echo "Developer key from GARMIN_DEVELOPER_KEY_B64"
          else
            echo "::error::GARMIN_DEVELOPER_KEY_B64 secret niet gevonden"
            exit 1
          fi
        env:
          KEY_B64: ${{ secrets.GARMIN_DEVELOPER_KEY_B64 }}

      - name: Create device definition
        run: |
          mkdir -p ~/.Garmin/ConnectIQ/Devices/fr965
          cat > ~/.Garmin/ConnectIQ/Devices/fr965/compiler.json << 'JSON'
          {
            "deviceId": "fr965",
            "displayName": "Forerunner 965",
            "deviceFamily": "round-454x454",
            "worldWidePartNumber": "006-B4315-00",
            "partNumbers": [
              { "number": "006-B4315-00", "firmwareVersion": "2502", "connectIQVersion": "5.2.0" }
            ],
            "resolution": { "width": 454, "height": 454 },
            "launcherIcon": { "width": 65, "height": 65 },
            "bitsPerPixel": 16,
            "orientation": "GFX_ORNTN_0",
            "gpuSupport": true,
            "alphaBlendingSupport": true,
            "screenRotationSupport": false,
            "exportSupport": true,
            "codePageSize": 4096,
            "appTypes": [
              { "type": "watchApp",   "memoryLimit": 786432 },
              { "type": "watchFace",  "memoryLimit": 131072 },
              { "type": "datafield",  "memoryLimit": 262144 },
              { "type": "background", "memoryLimit": 65536 },
              { "type": "glance",     "memoryLimit": 65536 }
            ]
          }
          JSON

      - name: Build .iq
        run: |
          mkdir -p bin
          connectiq-sdk/bin/monkeyc \
            -e \
            --override-devices-json ~/.Garmin/ConnectIQ/Devices \
            -f monkey.jungle \
            -o bin/regatta.iq \
            -y developer_key.der
          ls -lh bin/regatta.iq

      - name: Build .prg
        run: |
          connectiq-sdk/bin/monkeyc \
            -d fr965 \
            --override-devices-json ~/.Garmin/ConnectIQ/Devices \
            -f monkey.jungle \
            -o bin/regatta-fr965.prg \
            -y developer_key.der
          ls -lh bin/regatta-fr965.prg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: regatta-${{ github.sha }}
          path: |
            bin/regatta.iq
            bin/regatta-fr965.prg

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/regatta.iq
            bin/regatta-fr965.prg
