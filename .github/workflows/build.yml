name: Build Garmin IQ App

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SDK Manager CLI
        run: |
          curl -sL https://github.com/lindell/connect-iq-sdk-manager-cli/releases/download/v0.8.4/connect-iq-sdk-manager-cli_0.8.4_Linux_x86_64.tar.gz \
            | tar xz -C /tmp
          sudo mv /tmp/connect-iq-sdk-manager /usr/local/bin/
          connect-iq-sdk-manager --version

      - name: Accept Garmin license agreement
        env:
          AGREEMENT_HASH: ${{ secrets.GARMIN_AGREEMENT_HASH }}
        run: |
          connect-iq-sdk-manager agreement accept --acceptance-hash="$AGREEMENT_HASH"

      - name: Login to Garmin
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          connect-iq-sdk-manager login

      - name: Cache Garmin SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ~/.connect-iq-sdk-manager
          key: connectiq-sdk-${{ hashFiles('manifest.xml') }}

      - name: Download SDK & devices
        run: |
          # Download latest 7.x SDK (compatible with our target devices)
          connect-iq-sdk-manager sdk set "^7.2.0"
          # Download device definitions matching our manifest
          connect-iq-sdk-manager device download --manifest=manifest.xml

      - name: Add SDK to PATH
        run: |
          SDK_BIN=$(connect-iq-sdk-manager sdk current-path --bin)
          echo "$SDK_BIN" >> $GITHUB_PATH
          echo "SDK_BIN=$SDK_BIN" >> $GITHUB_ENV

      - name: Generate developer key
        run: |
          openssl genrsa -out /tmp/dev_key.pem 2048
          openssl req -new -key /tmp/dev_key.pem -out /tmp/dev_key.csr \
            -subj "/C=NL/O=Regatta/CN=Regatta Developer"
          openssl x509 -req -days 3650 -in /tmp/dev_key.csr \
            -signkey /tmp/dev_key.pem -out developer_key.der -outform DER

      - name: Build .iq
        run: |
          mkdir -p bin
          monkeyc \
            -f monkey.jungle \
            -o bin/regatta.iq \
            -y developer_key.der \
            -w \
            -l 0
          ls -lh bin/regatta.iq

      - name: Upload .iq artifact
        uses: actions/upload-artifact@v4
        with:
          name: regatta-${{ github.sha }}
          path: bin/regatta.iq
          if-no-files-found: error

      - name: Upload to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/regatta.iq
